<header class="site-header-row">
  <div class="container site-header">
    <h1 class="_visuallyhidden">Dart pub</h1>
    <button class="hamburger"></button>
    <div class="mask"></div>
    <div class="nav-wrap">
      <div class="nav-header">
        <a class="logo" [routerLink]="homeUrl"
          ><img
            src="https://pub.dev/static/hash-4k2q9dg1/img/pub-dev-logo.svg"
            alt="dart pub logo"
        /></a>
        <div class="_flex-space"></div>
        <button class="close"></button>
      </div>
    </div>
  </div>
</header>
<div class="_banner-bg">
  <div class="container">
    <div class="home-banner">
      <form class="search-bar" action="/packages">
        <input
          class="input"
          name="q"
          placeholder="Search Dart packages"
          autocomplete="on"
          autofocus="autofocus"
          [(ngModel)]="appService.keyword"
        />
        <button class="icon" (click)="submit()"></button>
      </form>
    </div>
  </div>
</div>
<div class="container">
  <router-outlet [routes]="Routes.all"></router-outlet>
</div>
<footer class="site-footer" *ngIf="!loading">
  <a class="link" href="https://github.com/itlwy/unpub">Source code</a>
  <a
    class="link github_issue"
    href="https://github.com/itlwy/unpub/issues/new"
    >Report an issue</a
  >
</footer>
